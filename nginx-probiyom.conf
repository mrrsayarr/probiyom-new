# Probiyom nginx configuration for the static dist/ deployment.
server {
    listen 80;
    listen [::]:80;
    server_name probiyom.com www.probiyom.com;

    root /var/www/probiyom/dist;
    index index.html;
    error_page 404 /seo-pages/404.html;

    # Generated route documents may only be reached through internal rewrites.
    location ^~ /seo-pages/ {
        internal;
        try_files $uri =404;
    }

    # Preserve the standalone demo's directory-index URL with html_handling:none.
    location = /st  { rewrite ^ /st/index.html last; }
    location = /st/ { rewrite ^ /st/index.html last; }
    location = /index.html { return 308 /; }
    location = /404.html { return 404; }

    # Canonical clean URLs omit a trailing slash.
    location ~ ^(.+)/+$ {
        return 308 $1$is_args$args;
    }

    # Existing files remain ordinary static assets; missing clean routes are mapped below.
    location / {
        try_files $uri @generated_page;
    }

    location @generated_page {
        rewrite ^/$ /seo-pages/index.html last;
        rewrite ^(.+)$ /seo-pages$1/index.html last;
    }

    # Static assets keep long-lived caching and missing assets remain 404s.
    location ~* \.(css|js|webp|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|txt|xml|pdf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\. {
        deny all;
    }
    location ~ /(serve\.py|start\.bat|_redirects|404\.html)$ {
        deny all;
    }
}
