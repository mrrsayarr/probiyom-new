# =============================================================================
# Probiyom - nginx sunucu konfigürasyonu (SPA fallback)
# -----------------------------------------------------------------------------
# Bu dosya, hash'siz (gerçek yol) router'lı sitenin nginx'te "geri dönüş" ve
# "yenileme" sırasında 404 vermemesi için gerekli kurulumu gösterir.
#
# NEREDE KULLANILIR:  Sitenin köküne kopyalayıp sunucudaki ilgili server bloğuna
# aktarabilir veya doğrudan /etc/nginx/sites-available/ altına koyabilirsiniz.
# (Gerçek canlı kurulumda root yolu kendi ortamınıza göre değişmelidir.)
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name probiyom.com www.probiyom.com;

    # Sitenizin dosyalarının bulunduğu dizin (sunucunuza göre ayarlayın)
    root /var/www/probiyom;
    index index.html;

    # ====================================================================
    # TEMEL KURAL: SPA fallback  (yenileme / geri / doğrudan alt-rota)
    # --------------------------------------------------------------------
    # - Gerçek bir dosya varsa (ornek: /images/x.webp) onu dondurur.
    # - Dosya yoksa /index.html dondurur; router adresteki gerçek yolu okuyup
    #   ilgili sayfayi (blog, urun grubu, vs.) cizer. Boylece 404 cikmaz.
    # ====================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ====================================================================
    # Statik varliklar: normal servis + onbellek
    # (Goruntu/css/js icin /index.html'e dusmese; kayip bir goruntude 404.)
    # ====================================================================
    location ~* \.(css|js|webp|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|txt|xml|pdf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ====================================================================
    # Temel guvenlik basliklari
    # ====================================================================
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ====================================================================
    # HTTPS kullaniyorsaniz (oneri): HTTP'yi HTTPS'e yonlendirir
    # (go ssl sertifikasi olan server bloğuna tasirsiniz)
    # ====================================================================
    # return 301 https://$host$request_uri;

    # ====================================================================
    # Yazma/gizli dosyalara erisimi engelle (guvenlik)
    # ====================================================================
    location ~ /\. {
        deny all;
    }
    location ~ /(serve\.py|start\.bat|_redirects|404\.html)$ {
        deny all;
    }
}
