<section class="page-section">
    <header class="section-header">
        <h1 class="text-brand">İletişim</h1>
        <p class="max-w-4xl text-muted">
            Merak ettiğiniz her konuda bizi arayabilirsiniz. Probiyom Ekibi olarak size yardımcı olmaktan memnuniyet
            duyarız.
        </p>
    </header>

    <section class="row g-4 align-items-stretch mt-3">
        <!-- Sol Kolon: Yenilenen Simgeli İletişim Kartı -->
        <div class="col-12 col-lg-5">
            <div class="card h-100 p-4 p-md-5 shadow-sm border border-light-subtle rounded-4 bg-white">
                <h3 class="fs-5 fw-bold text-brand mb-4 d-flex align-items-center gap-2">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"
                        class="text-secondary">
                        <path
                            d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.79 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                        </path>
                    </svg>
                    İletişim Bilgileri
                </h3>

                <div class="contact-info d-flex flex-column gap-3">
                    <!-- Adres -->
                    <div class="contact-item d-flex align-items-start gap-3 p-3 rounded-3 bg-light-subtle">
                        <div class="contact-icon-box rounded-circle d-flex align-items-center justify-content-center text-white flex-shrink-0"
                            style="width: 40px; height: 40px; background-color: var(--color-baltic-blue);">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                                stroke-width="2.5">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                            </svg>
                        </div>
                        <div>
                            <span class="contact-info-label d-block text-uppercase fw-bold text-muted"
                                style="font-size: 0.72rem; letter-spacing: 0.08em;">Adres</span>
                            <p id="contact-address" class="text-dark fw-semibold small mb-0 mt-1 lh-base"></p>
                        </div>
                    </div>

                    <!-- Telefon -->
                    <div class="contact-item d-flex align-items-center gap-3 p-3 rounded-3 bg-light-subtle">
                        <div class="contact-icon-box rounded-circle d-flex align-items-center justify-content-center text-white flex-shrink-0"
                            style="width: 40px; height: 40px; background-color: var(--color-baltic-blue);">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                                stroke-width="2.5">
                                <path
                                    d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.79 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                                </path>
                            </svg>
                        </div>
                        <div>
                            <span class="contact-info-label d-block text-uppercase fw-bold text-muted"
                                style="font-size: 0.72rem; letter-spacing: 0.08em;">Telefon</span>
                            <a id="contact-phone" href="" class="text-brand fw-bold text-decoration-none fs-6"></a>
                        </div>
                    </div>

                    <!-- E-Posta -->
                    <div class="contact-item d-flex align-items-center gap-3 p-3 rounded-3 bg-light-subtle">
                        <div class="contact-icon-box rounded-circle d-flex align-items-center justify-content-center text-white flex-shrink-0"
                            style="width: 40px; height: 40px; background-color: var(--color-baltic-blue);">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                                stroke-width="2.5">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z">
                                </path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </div>
                        <div>
                            <span class="contact-info-label d-block text-uppercase fw-bold text-muted"
                                style="font-size: 0.72rem; letter-spacing: 0.08em;">E-posta</span>
                            <a id="contact-email" href="" class="text-brand fw-bold text-decoration-none small"></a>
                        </div>
                    </div>

                    <!-- Sosyal Medya Kanalları (Dairesel Vektör İkon Butonları) -->
                    <div class="pt-3 border-top border-light-subtle">
                        <span class="contact-info-label d-block text-uppercase fw-bold text-muted mb-3"
                            style="font-size: 0.72rem; letter-spacing: 0.08em;">Sosyal Medya Kanallarımız</span>
                        <div class="d-flex align-items-center gap-2">

                            <!-- Instagram -->
                            <a id="contact-instagram" href="" target="_blank" rel="noopener" aria-label="Instagram"
                                class="contact-social-btn">
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                                </svg>
                            </a>

                            <!-- X (Twitter) -->
                            <a id="contact-x" href="" target="_blank" rel="noopener" aria-label="X (Twitter)"
                                class="contact-social-btn">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                                    <path
                                        d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
                                </svg>
                            </a>

                            <!-- LinkedIn -->
                            <a id="contact-linkedin" href="" target="_blank" rel="noopener" aria-label="LinkedIn"
                                class="contact-social-btn">
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path
                                        d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z">
                                    </path>
                                    <rect x="2" y="9" width="4" height="12"></rect>
                                    <circle cx="4" cy="4" r="2"></circle>
                                </svg>
                            </a>

                            <!-- YouTube -->
                            <a id="contact-youtube" href="" target="_blank" rel="noopener" aria-label="YouTube"
                                class="contact-social-btn">
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path
                                        d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z">
                                    </path>
                                    <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon>
                                </svg>
                            </a>

                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- Sağ Kolon: Harita -->
        <div class="col-12 col-lg-7">
            <div id="contact-map" class="h-100"></div>
        </div>
    </section>

    <!-- Form Konteynırı -->
    <div id="contact-form-container" class="mt-4"></div>
</section>
